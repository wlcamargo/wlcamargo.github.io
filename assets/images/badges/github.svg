<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="GitHub Foundations certification badge">
  <defs>
    <linearGradient id="gh-shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#333a44"/>
      <stop offset="1" stop-color="#171b21"/>
    </linearGradient>
    <linearGradient id="gh-ribbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9eaec"/>
    </linearGradient>
  </defs>

  <!-- shield -->
  <!-- the stroke keeps the silhouette readable on both the light and the dark card -->
  <path d="M20,26 Q20,10 36,10 H204 Q220,10 220,26 V132 Q220,182 120,230 Q20,182 20,132 Z"
        fill="url(#gh-shield)" stroke="#575e6b" stroke-width="3"/>

  <!-- github mark -->
  <g transform="translate(101,38) scale(1.05)" fill="#ffffff">
    <path d="M18 0C8.06 0 0 8.06 0 18c0 7.95 5.16 14.7 12.31 17.08.9.17 1.23-.39 1.23-.86 0-.43-.02-1.56-.02-3.06-5.01 1.09-6.07-2.42-6.07-2.42-.82-2.09-2.01-2.65-2.01-2.65-1.64-1.12.12-1.1.12-1.1 1.82.13 2.78 1.86 2.78 1.86 1.61 2.75 4.22 1.96 5.25 1.5.16-1.16.63-1.96 1.14-2.41-3.99-.45-8.2-2-8.2-8.88 0-1.96.7-3.56 1.84-4.81-.18-.45-.8-2.28.17-4.75 0 0 1.51-.48 4.94 1.84 1.43-.4 2.97-.6 4.5-.61 1.53.01 3.07.21 4.5.61 3.43-2.32 4.93-1.84 4.93-1.84.98 2.47.36 4.3.18 4.75 1.15 1.25 1.84 2.85 1.84 4.81 0 6.9-4.21 8.42-8.22 8.86.65.55 1.22 1.65 1.22 3.33 0 2.4-.02 4.34-.02 4.93 0 .48.33 1.04 1.24.86C30.84 32.7 36 25.95 36 18c0-9.94-8.06-18-18-18z"/>
  </g>

  <!-- ribbon -->
  <rect x="4" y="98" width="232" height="56" rx="9"
        fill="url(#gh-ribbon)" stroke="#4b515b" stroke-width="3"/>
  <text x="120" y="121" text-anchor="middle" fill="#1f2328"
        font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700">GitHub</text>
  <text x="120" y="143" text-anchor="middle" fill="#1f2328"
        font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700">FOUNDATIONS</text>

  <text x="120" y="176" text-anchor="middle" fill="#c9ccd2" letter-spacing="2.5"
        font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700">CERTIFIED</text>
  <path d="M120 184 l4.4 9 9.8 1.4 -7.1 6.9 1.7 9.8 -8.8 -4.6 -8.8 4.6 1.7 -9.8 -7.1 -6.9 9.8 -1.4 Z"
        fill="#ffffff"/>
</svg>
